stages:
  - test
  - bandit
  - dependency_audit
  - secret_scan
  - semgrep
  - container
  - trivy
  - deploy
  - dast

# ==========================================
# CONFIGURATION GLOBALE
# ==========================================

default:
  tags:
    - securebank-ce

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "securebank:$CI_COMMIT_SHA"

cache:
  paths:
    - .cache/pip

# ==========================================
# STAGE 1 : TESTS UNITAIRES
# ==========================================

unit_tests:
  image: python:3.12-slim
  stage: test

  before_script:
    - pip install -r requirements.txt

  script:
    - pytest -q

  allow_failure: false

# ==========================================
# STAGE 2 : BANDIT
# ANALYSE DE SECURITE DU CODE PYTHON
# ==========================================

bandit:
  image: python:3.12-slim
  stage: bandit

  before_script:
    - pip install bandit

  script:
    - bandit -r src -ll

  allow_failure: false

# ==========================================
# STAGE 3 : DEPENDENCY AUDIT
# ANALYSE DES DEPENDANCES PYTHON
# ==========================================

dependency_audit:
  image: python:3.12-slim
  stage: dependency_audit

  before_script:
    - python -m pip install --no-cache-dir pip-audit

  script:
    - mkdir -p reports/final/dependencies
    - pip-audit --no-deps --disable-pip -r requirements.txt --format json --output reports/final/dependencies/pip-audit.json
    - pip-audit --no-deps --disable-pip -r requirements.txt

  artifacts:
    when: always
    paths:
      - reports/final/dependencies/pip-audit.json
    expire_in: 30 days

  allow_failure: false

# ==========================================
# STAGE 4 : SECRET SCAN
# DETECTION DE SECRETS AVEC GITLEAKS
# ==========================================

secret_scan:
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  stage: secret_scan

  script:
    - gitleaks dir --config .gitleaks.toml --redact --exit-code 1 .

  allow_failure: false

# ==========================================
# STAGE 5 : SEMGREP
# ANALYSE STATIQUE DE SECURITE (SAST)
# ==========================================


semgrep:
  image: semgrep/semgrep:latest
  stage: semgrep

  variables:
    SEMGREP_SEND_METRICS: "off"

  script:
    - echo "===== SEMGREP SECURITY SCAN ====="
    - semgrep scan --config .semgrep/python.yml --metrics=off --disable-version-check --error src

  allow_failure: false
  
# ==========================================
# STAGE 6 : CONSTRUCTION IMAGE DOCKER
# ==========================================

container_build:
  image: docker:27.5.1-cli
  stage: container

  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker info
    - docker build -t "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar
    - test -s image.tar

  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

  allow_failure: false

# ==========================================
# STAGE 7 : TRIVY
# ANALYSE DES VULNERABILITES DOCKER
# ==========================================

trivy_scan:
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]

  stage: trivy

  dependencies:
    - container_build

  variables:
    TRIVY_NO_PROGRESS: "true"

  script:
    - mkdir -p reports/final/trivy
    - trivy --version

    # Rapport JSON
    - >-
      trivy image
      --timeout 15m
      --input image.tar
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 0
      --format json
      --output reports/final/trivy/trivy-ci.json

    # Verification bloquante
    - >-
      trivy image
      --timeout 15m
      --input image.tar
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 1
      --format table

  artifacts:
    when: always
    paths:
      - reports/final/trivy/trivy-ci.json
    expire_in: 30 days

  allow_failure: false

# ==========================================
# STAGE 8 : TEST RUNNER DE DEPLOIEMENT
# RUNNER DEDIE AVEC ACCES DOCKER
# ==========================================

docker_access_test:
  stage: deploy

  image: docker:27.5.1-cli

  tags:
    - staging-deploy

  script:
    - echo "===== TEST ACCES AU MOTEUR DOCKER ====="
    - docker info

    - echo "===== VERIFICATION DU CONTENEUR STAGING ====="
    - docker ps --filter name=securebank-staging

    - echo "===== TEST TERMINE ====="

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  allow_failure: false

# ==========================================
# STAGE 9 : OWASP ZAP DAST
# ANALYSE DYNAMIQUE DE L'API SECUREBANK
# ==========================================

zap_api_scan:
  image: docker:27.5.1-cli
  stage: dast

  dependencies:
    - container_build

  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  script:
    # 1. Preparation des rapports
    - mkdir -p reports/final/zap

    # 2. Chargement de l'image SecureBank
    - docker info
    - docker load -i image.tar

    # 3. Creation du reseau et du volume uniques
    - docker network create "securebank-dast-net-${CI_PIPELINE_ID}"
    - docker volume create "securebank-dast-data-${CI_PIPELINE_ID}"

    # 4. Demarrage de SecureBank
    - >-
      docker run -d
      --name securebank-dast-app-${CI_PIPELINE_ID}
      --network "securebank-dast-net-${CI_PIPELINE_ID}"
      --mount type=volume,source=securebank-dast-data-${CI_PIPELINE_ID},target=/data
      -e SECRET_KEY=ci-dast-test-only
      -e DATABASE_PATH=/data/securebank.db
      -e VULNERABLE_DEMO=0
      "$IMAGE_TAG"

    # 5. Verification de disponibilite
    - |
      attempt=0

      until docker exec securebank-dast-app-${CI_PIPELINE_ID} python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)" >/dev/null 2>&1; do
        attempt=$((attempt + 1))

        if [ "$attempt" -ge 30 ]; then
          echo "ERREUR : SecureBank ne demarre pas."
          docker logs securebank-dast-app-${CI_PIPELINE_ID}
          exit 1
        fi

        sleep 2
      done

      echo "SecureBank est disponible."

    # 6. Adaptation de la specification OpenAPI
    - >-
      cp
      reports/final/zap/securebank-openapi.yaml
      reports/final/zap/securebank-openapi-ci.yaml

    - >-
      sed -i
      "s#http://host.docker.internal:5001#http://securebank-dast-app-${CI_PIPELINE_ID}:5000#g"
      reports/final/zap/securebank-openapi-ci.yaml

    # 7. Scan OWASP ZAP en mode passif
    - >-
      docker run --rm
      --network "securebank-dast-net-${CI_PIPELINE_ID}"
      -v "$CI_PROJECT_DIR:/zap/wrk/:rw"
      ghcr.io/zaproxy/zaproxy:stable
      zap-api-scan.py
      -t /zap/wrk/reports/final/zap/securebank-openapi-ci.yaml
      -f openapi
      -S
      -r /zap/wrk/reports/final/zap/zap-api-ci.html
      -J /zap/wrk/reports/final/zap/zap-api-ci.json
      -T 5

  after_script:
    - docker rm -f securebank-dast-app-${CI_PIPELINE_ID} || true
    - docker network rm "securebank-dast-net-${CI_PIPELINE_ID}" || true
    - docker volume rm "securebank-dast-data-${CI_PIPELINE_ID}" || true

  artifacts:
    when: always
    paths:
      - reports/final/zap/zap-api-ci.html
      - reports/final/zap/zap-api-ci.json
      - reports/final/zap/securebank-openapi-ci.yaml
    expire_in: 30 days

  allow_failure: false
