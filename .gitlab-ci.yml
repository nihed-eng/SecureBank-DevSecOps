
# ============================================================
# SECUREBANK - PIPELINE DEVSECOPS COMPLET
# Tests -> SAST -> Secrets -> Docker -> Trivy -> DAST
# -> Staging -> Rapport PDF Telegram -> Production manuelle
# ============================================================

stages:
  - test
  - bandit
  - dependency_audit
  - secret_scan
  - semgrep
  - container
  - trivy
  - dast
  - staging
  - report
  - production

# ============================================================
# CONFIGURATION GLOBALE
# ============================================================

default:
  tags:
    - securebank-ce

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "securebank:$CI_COMMIT_SHA"

cache:
  paths:
    - .cache/pip

# ============================================================
# STAGE 1 - TESTS UNITAIRES
# ============================================================

unit_tests:
  stage: test
  image: python:3.12-slim

  before_script:
    - pip install -r requirements.txt

  script:
    - pytest -q

  allow_failure: false

# ============================================================
# STAGE 2 - BANDIT : SECURITE PYTHON
# ============================================================

bandit:
  stage: bandit
  image: python:3.12-slim

  before_script:
    - python -m pip install --no-cache-dir --retries 10 --timeout 60 bandit==1.9.4

  script:
    - bandit -r src -ll

  allow_failure: false

# ============================================================
# STAGE 3 - PIP-AUDIT : DEPENDANCES
# ============================================================

dependency_audit:
  stage: dependency_audit
  image: python:3.12-slim

  before_script:
    - python -m pip install --no-cache-dir pip-audit

  script:
    - mkdir -p reports/final/dependencies
    - pip-audit --no-deps --disable-pip -r requirements.txt --format json --output reports/final/dependencies/pip-audit.json
    - pip-audit --no-deps --disable-pip -r requirements.txt

  artifacts:
    when: always
    paths:
      - reports/final/dependencies/pip-audit.json
    expire_in: 30 days

  allow_failure: false

# ============================================================
# STAGE 4 - GITLEAKS : DETECTION DES SECRETS
# ============================================================

secret_scan:
  stage: secret_scan

  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  script:
    - gitleaks dir --config .gitleaks.toml --redact --exit-code 1 .

  allow_failure: false

# ============================================================
# STAGE 5 - SEMGREP : ANALYSE SAST
# ============================================================

semgrep:
  stage: semgrep
  image: semgrep/semgrep:latest

  variables:
    SEMGREP_SEND_METRICS: "off"

  script:
    - echo "===== SEMGREP SECURITY SCAN ====="
    - semgrep scan --config .semgrep/python.yml --metrics=off --disable-version-check --error src

  allow_failure: false

# ============================================================
# STAGE 6 - DOCKER BUILD
# ============================================================

container_build:
  stage: container
  image: docker:27.5.1-cli

  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker info
    - docker build --pull -t "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar
    - test -s image.tar

  artifacts:
    paths:
      - image.tar
    expire_in: 7 days

  allow_failure: false

# ============================================================
# STAGE 7 - TRIVY : SCAN IMAGE DOCKER
# ============================================================

trivy_scan:
  stage: trivy

  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]

  dependencies:
    - container_build

  variables:
    TRIVY_NO_PROGRESS: "true"

  script:
    - mkdir -p reports/final/trivy
    - trivy --version

    # Rapport JSON
    - >-
      trivy image
      --timeout 15m
      --input image.tar
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 0
      --format json
      --output reports/final/trivy/trivy-ci.json

    # Controle bloquant
    - >-
      trivy image
      --timeout 15m
      --input image.tar
      --scanners vuln
      --severity HIGH,CRITICAL
      --ignore-unfixed
      --exit-code 1
      --format table

  artifacts:
    when: always
    paths:
      - reports/final/trivy/trivy-ci.json
    expire_in: 30 days

  allow_failure: false

# ============================================================
# STAGE 8 - OWASP ZAP : SCAN DAST
# ============================================================

zap_api_scan:
  stage: dast
  image: docker:27.5.1-cli

  dependencies:
    - container_build

  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""

  script:
    - mkdir -p reports/final/zap
    - docker info
    - docker load -i image.tar

    # Reseau et volume temporaires
    - docker network create "securebank-dast-net-${CI_PIPELINE_ID}"
    - docker volume create "securebank-dast-data-${CI_PIPELINE_ID}"

    # Demarrage de l'application de test
    - >-
      docker run -d
      --name "securebank-dast-app-${CI_PIPELINE_ID}"
      --network "securebank-dast-net-${CI_PIPELINE_ID}"
      --mount "type=volume,source=securebank-dast-data-${CI_PIPELINE_ID},target=/data"
      -e SECRET_KEY=ci-dast-test-only
      -e DATABASE_PATH=/data/securebank.db
      -e VULNERABLE_DEMO=0
      "$IMAGE_TAG"

    # Verification de disponibilite
    - |
      attempt=0

      until docker exec "securebank-dast-app-${CI_PIPELINE_ID}" \
        python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)" \
        >/dev/null 2>&1; do

        attempt=$((attempt + 1))

        if [ "$attempt" -ge 30 ]; then
          echo "ERREUR - SecureBank ne demarre pas"
          docker logs "securebank-dast-app-${CI_PIPELINE_ID}"
          exit 1
        fi

        sleep 2
      done

      echo "SecureBank DAST disponible"

    # Adaptation OpenAPI
    - >-
      cp
      reports/final/zap/securebank-openapi.yaml
      reports/final/zap/securebank-openapi-ci.yaml

    - >-
      sed -i
      "s#http://host.docker.internal:5001#http://securebank-dast-app-${CI_PIPELINE_ID}:5000#g"
      reports/final/zap/securebank-openapi-ci.yaml

    # Scan ZAP
    - >-
      docker run --rm
      --network "securebank-dast-net-${CI_PIPELINE_ID}"
      -v "$CI_PROJECT_DIR:/zap/wrk/:rw"
      ghcr.io/zaproxy/zaproxy:stable
      zap-api-scan.py
      -t /zap/wrk/reports/final/zap/securebank-openapi-ci.yaml
      -f openapi
      -S
      -r /zap/wrk/reports/final/zap/zap-api-ci.html
      -J /zap/wrk/reports/final/zap/zap-api-ci.json
      -T 5

  after_script:
    - docker rm -f "securebank-dast-app-${CI_PIPELINE_ID}" || true
    - docker network rm "securebank-dast-net-${CI_PIPELINE_ID}" || true
    - docker volume rm "securebank-dast-data-${CI_PIPELINE_ID}" || true

  artifacts:
    when: always
    paths:
      - reports/final/zap/zap-api-ci.html
      - reports/final/zap/zap-api-ci.json
      - reports/final/zap/securebank-openapi-ci.yaml
    expire_in: 30 days

  allow_failure: false

# ============================================================
# STAGE 9 - STAGING : DEPLOIEMENT AUTOMATIQUE
# ============================================================

staging_deploy:
  stage: staging
  image: docker:27.5.1-cli

  tags:
    - staging-deploy

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  dependencies:
    - container_build

  resource_group: securebank-staging

  script:
    - |
      set -eu

      echo "===== VALIDATION STAGING ====="
      test -n "${SECRET_KEY:-}" || {
        echo "ERREUR - SECRET_KEY absente"
        exit 1
      }

      echo "===== CHARGEMENT IMAGE ====="
      docker load -i image.tar

      echo "===== REMPLACEMENT STAGING ====="
      docker rm -f securebank-staging || true

      echo "===== DEMARRAGE STAGING ====="
      docker run -d \
        --name securebank-staging \
        --restart unless-stopped \
        -p 5002:5000 \
        --mount type=volume,source=securebank-staging-data,target=/data \
        -e SECRET_KEY="$SECRET_KEY" \
        -e APP_ENV=staging \
        -e DATABASE_PATH=/data/securebank.db \
        -e VULNERABLE_DEMO=0 \
        "$IMAGE_TAG"

      echo "===== HEALTH CHECK STAGING ====="
      attempt=0

      until docker exec securebank-staging python -c \
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)" \
        >/dev/null 2>&1; do

        attempt=$((attempt + 1))

        if [ "$attempt" -ge 30 ]; then
          docker logs --tail 50 securebank-staging
          echo "ECHEC - Staging indisponible"
          exit 1
        fi

        sleep 2
      done

      echo "STAGING DEPLOYE AVEC SUCCES"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

  allow_failure: false

# ============================================================
# STAGE 10 - RAPPORT PDF + TELEGRAM
# EXECUTION MEME SI UN SCAN ECHOUE
# ============================================================

telegram_pdf_report:
  stage: report
  image: python:3.12-slim
  tags:
    - securebank-ce
  dependencies: []
  variables:
    PYTHONUNBUFFERED: "1"
  before_script:
    - python -m pip install --no-cache-dir "requests==2.32.3" "reportlab==4.2.5" "chardet==5.2.0" "urllib3<2.3"
  script:
    - |
      set -eu
      echo "===== CONFIGURATION ET TEST DE L'API GITLAB ====="
      # Adresse testee avec succes depuis un conteneur Docker local.
      export GITLAB_API_URL="http://host.docker.internal:8929/api/v4"
      export NO_PROXY="host.docker.internal,localhost,127.0.0.1"
      export no_proxy="$NO_PROXY"

      test -n "${GITLAB_REPORT_TOKEN:-}" || {
        echo "ATTENTION : GITLAB_REPORT_TOKEN absent"
      }

      # Diagnostic non bloquant : meme si l'API echoue,
      # le script doit pouvoir produire et envoyer son PDF de diagnostic.
      python - <<'PYTEST' || true
      import os
      import requests

      url = (os.environ['GITLAB_API_URL'] + '/projects/'
             + os.environ['CI_PROJECT_ID'] + '/pipelines/'
             + os.environ['CI_PIPELINE_ID'] + '/jobs')
      headers = {'PRIVATE-TOKEN': os.environ.get('GITLAB_REPORT_TOKEN', '')}
      try:
          response = requests.get(url, headers=headers,
                                  params={'per_page': 100}, timeout=15)
          print('API GitLab HTTP :', response.status_code)
          if response.ok:
              print('Jobs accessibles :', len(response.json()))
          else:
              print('Erreur API ou autorisation :', response.status_code)
      except requests.RequestException as exc:
          print('Erreur de connexion API :', type(exc).__name__, str(exc))
      PYTEST

      echo "===== GENERATION ET ENVOI PDF TELEGRAM ====="
      python ci/generate_pipeline_report.py
      test -s securebank_pipeline_report.pdf
      echo "PDF genere : securebank_pipeline_report.pdf"
  artifacts:
    when: always
    paths:
      - securebank_pipeline_report.pdf
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never
  allow_failure: true

# ============================================================
# STAGE 11 - PRODUCTION LOCALE
# DEPLOIEMENT REEL, MANUEL, PREMIERE INSTALLATION
# ============================================================

production_deploy:
  stage: production
  image: docker:27.5.1-cli

  tags:
    - staging-deploy

  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"

  environment:
    name: production
    deployment_tier: production

  resource_group: securebank-production

  dependencies:
    - container_build

  script:
    - |
      set -eu

      echo "===== VALIDATION PRODUCTION ====="

      test -n "${PROD_SECRET_KEY:-}" || {
        echo "ERREUR - PROD_SECRET_KEY absente"
        exit 1
      }

      test "${#PROD_SECRET_KEY}" -ge 32 || {
        echo "ERREUR - PROD_SECRET_KEY trop courte"
        exit 1
      }

      test -s image.tar

      # Protection contre le remplacement involontaire
      if docker container inspect securebank-production >/dev/null 2>&1; then
        echo "ERREUR - Production deja existante"
        echo "Remplacement refuse pour proteger les donnees"
        exit 1
      fi

      echo "===== CHARGEMENT IMAGE PRODUCTION ====="
      docker load -i image.tar

      echo "===== VOLUME INDEPENDANT ====="
      docker volume create securebank-production-data

      echo "===== DEMARRAGE PRODUCTION ====="
      docker run -d \
        --name securebank-production \
        --restart unless-stopped \
        -p 127.0.0.1:5003:5000 \
        --mount type=volume,source=securebank-production-data,target=/data \
        -e APP_ENV=production \
        -e SECRET_KEY="$PROD_SECRET_KEY" \
        -e DATABASE_PATH=/data/securebank.db \
        -e VULNERABLE_DEMO=0 \
        "$IMAGE_TAG"

      echo "===== HEALTH CHECK PRODUCTION ====="

      attempt=0

      until docker exec securebank-production python -c \
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)" \
        >/dev/null 2>&1; do

        attempt=$((attempt + 1))

        if [ "$attempt" -ge 30 ]; then
          echo "ERREUR - Production indisponible"
          docker logs --tail 50 securebank-production
          docker rm -f securebank-production || true
          exit 1
        fi

        sleep 2
      done

      echo "===== PRODUCTION DEPLOYEE AVEC SUCCES ====="

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
    - when: never

  allow_failure: false
