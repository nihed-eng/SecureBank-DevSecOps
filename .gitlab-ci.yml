stages: [test, security, container]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_TAG: "securebank:$CI_COMMIT_SHA"

cache:
  paths: [.cache/pip]

unit_tests:
  image: python:3.12-slim
  stage: test
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest -q

bandit:
  image: python:3.12-slim
  stage: security
  before_script: ["pip install bandit"]
  script: ["bandit -r src -ll"]
  allow_failure: false

dependency_audit:
  image: python:3.12-slim
  stage: security
  before_script:
    - pip install pip-audit
  script:
    - pip-audit -r requirements.txt
  allow_failure: false


semgrep:
  image: returntocorp/semgrep:latest
  stage: security
  script: ["semgrep scan --config p/python --error src"]

secret_scan:
  image: zricetheboss/gitleaks:latest
  stage: security
  script:
    - gitleaks dir --config .gitleaks.toml --redact --exit-code 1 .

container_build:
  image: docker:27.5.1-cli
  stage: container
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker info
    - docker build -t "$IMAGE_TAG" .
    - docker save "$IMAGE_TAG" -o image.tar
    - test -s image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day

trivy_scan:
  image:
    name: aquasec/trivy:0.76.1
    entrypoint: [""]
  stage: container
  needs:
    - job: container_build
      artifacts: true
  variables:
    TRIVY_NO_PROGRESS: "true"
  script:
    - mkdir -p reports/final/trivy
    - trivy --version
    - trivy image --input image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --format json --output reports/final/trivy/trivy-ci.json
    - trivy image --input image.tar --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table
  artifacts:
    when: always
    paths:
      - reports/final/trivy/trivy-ci.json
    expire_in: 30 days
  allow_failure: false