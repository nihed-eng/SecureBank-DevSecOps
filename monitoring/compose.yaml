services:
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: securebank-blackbox
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox.yml:/config/blackbox.yml:ro
    command:
      - "--config.file=/config/blackbox.yml"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: securebank-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - blackbox-exporter
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: securebank-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
